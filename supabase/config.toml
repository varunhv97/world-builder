project_id = "world-builder"

# This file deliberately declares only production settings we own. Omitted
# properties remain under Supabase's hosted defaults rather than being reset.
[auth]
site_url = "https://world-builder-one.vercel.app"
additional_redirect_urls = ["http://localhost:5173", "https://world-builder-one.vercel.app"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
# Empty requirements preserves passphrase-friendly passwords; Supabase's
# compromised-password protection is enabled in the hosted Auth dashboard.
password_requirements = ""

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"

[auth.rate_limit]
sign_in_sign_ups = 10
token_verifications = 10
